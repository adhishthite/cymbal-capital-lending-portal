[project]
name = "cymbal-capital-lending-backend"
version = "0.1.0"
description = "Cymbal Capital RBI Digital Lending & KFS Compliance Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.2",
    "google-cloud-bigquery>=3.46.2",
    "google-cloud-dlp>=3.40.0",
    "google-cloud-firestore>=2.34.1",
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
